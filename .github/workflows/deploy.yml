# Ask RGV Backend — build all service images → push to GHCR → SSH deploy on VPS.
#
# Build jobs run in parallel. ask-rgv-embed is skipped unless embeddings/ changed.
# GHA layer cache keeps warm builds under 2 minutes.
#
# Migrations are baked into the ask-rgv-backend image (migrations/ is copied in
# by the Dockerfile). The app's db/migrations.py runner applies any pending
# migrations at startup — no manual SCP or psql steps needed.
#
# Images built:
#   ghcr.io/marava-tech/ask-rgv-backend:latest
#   ghcr.io/marava-tech/ask-rgv-ingestion:latest
#   ghcr.io/marava-tech/ask-rgv-embed:latest
#
# Secrets required:
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY

name: Deploy backend

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ask-rgv-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./app/Dockerfile
          push: true
          tags: ghcr.io/marava-tech/ask-rgv-backend:latest
          cache-from: type=gha,scope=ask-rgv-backend
          cache-to: type=gha,mode=max,scope=ask-rgv-backend

  build-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./ingestion-worker
          push: true
          tags: ghcr.io/marava-tech/ask-rgv-ingestion:latest
          cache-from: type=gha,scope=ask-rgv-ingestion
          cache-to: type=gha,mode=max,scope=ask-rgv-ingestion

  build-embed:
    runs-on: ubuntu-latest
    outputs:
      rebuilt: ${{ steps.filter.outputs.embeddings }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            embeddings:
              - 'embeddings/**'
      - uses: docker/login-action@v3
        if: steps.filter.outputs.embeddings == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
        if: steps.filter.outputs.embeddings == 'true'
      - uses: docker/build-push-action@v5
        if: steps.filter.outputs.embeddings == 'true'
        with:
          context: ./embeddings
          push: true
          tags: ghcr.io/marava-tech/ask-rgv-embed:latest
          cache-from: type=gha,scope=ask-rgv-embed
          cache-to: type=gha,mode=max,scope=ask-rgv-embed

  deploy:
    needs: [build-backend, build-ingestion, build-embed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH secrets
        env:
          SERVER_HOST_VAL: ${{ secrets.SERVER_HOST }}
          SERVER_USER_VAL: ${{ secrets.SERVER_USER }}
          SERVER_KEY_VAL: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          ok=0
          [ -z "$SERVER_HOST_VAL" ] && echo "::error::Secret SERVER_HOST is missing." && ok=1
          [ -z "$SERVER_USER_VAL" ] && echo "::error::Secret SERVER_USER is missing." && ok=1
          [ -z "$SERVER_KEY_VAL"  ] && echo "::error::Secret SERVER_SSH_KEY is missing." && ok=1
          exit "$ok"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null \
            || echo "::warning::ssh-keyscan timed out — falling back to StrictHostKeyChecking=accept-new"
          cat >> ~/.ssh/config <<'EOF'
          Host *
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF

      - name: Deploy on server via SSH
        env:
          EMBED_REBUILT: ${{ needs.build-embed.outputs.rebuilt }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "EMBED_REBUILT='${EMBED_REBUILT}' bash -s" << 'ENDSSH'
          set -euo pipefail
          COMPOSE="docker compose -f /root/server-v2/services/ask-rgv-backend/docker-compose.yml --env-file /root/server-v2/.env"

          $COMPOSE up -d --no-recreate ask-rgv-postgres ask-rgv-redis ask-rgv-qdrant

          for i in $(seq 1 15); do
            docker exec ask-rgv-postgres pg_isready -U askrgv -d askrgv && break
            echo "Waiting for postgres... ($i/15)"; sleep 2
          done

          pull_with_retry() {
            local service=$1
            for attempt in 1 2 3; do
              echo "Pulling $service (attempt $attempt)..."
              $COMPOSE pull "$service" && return 0
              [ $attempt -lt 3 ] && echo "Retrying in 15s..." && sleep 15
            done
            echo "ERROR: failed to pull $service after 3 attempts" && return 1
          }

          pull_with_retry ask-rgv-backend
          pull_with_retry ask-rgv-ingestion

          if [ "${EMBED_REBUILT}" = "true" ]; then
            echo "embeddings/ changed — pulling ask-rgv-embed"
            pull_with_retry ask-rgv-embed
            $COMPOSE up -d --force-recreate ask-rgv-embed
          else
            echo "embeddings/ unchanged — skipping ask-rgv-embed pull"
            if docker ps --filter "name=ask-rgv-embed" --filter "status=running" -q | grep -q .; then
              echo "ask-rgv-embed already running — no action needed"
            else
              $COMPOSE up -d --no-recreate ask-rgv-embed
            fi
          fi

          # Migrations are baked into the image and applied automatically at startup
          # by db/migrations.py — no manual psql steps needed here.
          $COMPOSE up -d --force-recreate ask-rgv-backend ask-rgv-ingestion

          docker image prune -f
          sleep 10
          docker logs ask-rgv-backend --tail 30
          ENDSSH
