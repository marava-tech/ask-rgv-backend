# Ask RGV Backend — build all service images → push to GHCR → SSH deploy on VPS.
#
# Build jobs run in parallel. bge-m3 is skipped unless embeddings/ changed.
# GHA layer cache keeps warm builds under 2 minutes.
#
# Images built:
#   ghcr.io/marava-tech/askrgv-backend:latest
#   ghcr.io/marava-tech/askrgv-ingestion:latest
#   ghcr.io/marava-tech/askrgv-bge-m3:latest
#
# Secrets required:
#   SERVER_HOST, SERVER_USER, SERVER_SSH_KEY
#   GHCR_PAT — Personal Access Token with write:packages scope (needed for first push to new package)

name: Deploy backend

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: askrgv-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ghcr.io/marava-tech/askrgv-backend:latest
          cache-from: type=gha,scope=askrgv-backend
          cache-to: type=gha,mode=max,scope=askrgv-backend

  build-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./ingestion-worker
          push: true
          tags: ghcr.io/marava-tech/askrgv-ingestion:latest
          cache-from: type=gha,scope=askrgv-ingestion
          cache-to: type=gha,mode=max,scope=askrgv-ingestion

  build-bge-m3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            embeddings:
              - 'embeddings/**'
      - uses: docker/login-action@v3
        if: steps.filter.outputs.embeddings == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - uses: docker/setup-buildx-action@v3
        if: steps.filter.outputs.embeddings == 'true'
      - uses: docker/build-push-action@v5
        if: steps.filter.outputs.embeddings == 'true'
        with:
          context: ./embeddings
          push: true
          tags: ghcr.io/marava-tech/askrgv-bge-m3:latest
          cache-from: type=gha,scope=askrgv-bge-m3
          cache-to: type=gha,mode=max,scope=askrgv-bge-m3

  deploy:
    needs: [build-backend, build-ingestion, build-bge-m3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SSH secrets
        env:
          SERVER_HOST_VAL: ${{ secrets.SERVER_HOST }}
          SERVER_USER_VAL: ${{ secrets.SERVER_USER }}
          SERVER_KEY_VAL: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          ok=0
          [ -z "$SERVER_HOST_VAL" ] && echo "::error::Secret SERVER_HOST is missing." && ok=1
          [ -z "$SERVER_USER_VAL" ] && echo "::error::Secret SERVER_USER is missing." && ok=1
          [ -z "$SERVER_KEY_VAL"  ] && echo "::error::Secret SERVER_SSH_KEY is missing." && ok=1
          exit "$ok"

      - name: Copy migrations to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "migrations/"
          target: /tmp/askrgv-migrations-ci/

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            COMPOSE="docker compose -f /root/server-setup/services/ask-rgv-backend/docker-compose.yml --env-file /root/server-setup/.env"

            $COMPOSE up -d --no-recreate askrgv-postgres askrgv-redis askrgv-qdrant

            for i in $(seq 1 15); do
              docker exec askrgv-postgres pg_isready -U askrgv -d askrgv && break
              echo "Waiting for postgres... ($i/15)"; sleep 2
            done

            docker exec askrgv-postgres psql -U askrgv -d askrgv -c \
              "CREATE TABLE IF NOT EXISTS schema_migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT NOW());"

            for f in $(find /tmp/askrgv-migrations-ci/migrations -name '*.sql' | sort); do
              fname=$(basename "$f")
              applied=$(docker exec askrgv-postgres psql -U askrgv -d askrgv -tAc \
                "SELECT 1 FROM schema_migrations WHERE filename='$fname'")
              if [ -z "$applied" ]; then
                echo "Applying $fname..."
                docker exec -i askrgv-postgres psql -U askrgv -d askrgv < "$f"
                docker exec askrgv-postgres psql -U askrgv -d askrgv -c \
                  "INSERT INTO schema_migrations (filename) VALUES ('$fname');"
              else
                echo "Skipping $fname (already applied)"
              fi
            done

            $COMPOSE pull askrgv-backend askrgv-ingestion askrgv-bge-m3
            $COMPOSE up -d --force-recreate askrgv-backend askrgv-ingestion askrgv-bge-m3

            docker image prune -f
            sleep 10
            docker logs askrgv-backend --tail 30
